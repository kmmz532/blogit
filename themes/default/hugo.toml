# Blogit テーマ。Hugo Modules としてサイトから取り込む
[module]
  [module.hugoVersion]
    min = "0.141.0"
    extended = true
  [[module.imports]]
    path = "github.com/kmmz532/hugo-gh-admin"
  [[module.imports]]
    path = "github.com/kmmz532/hugo-shortcodes"

[outputs]
