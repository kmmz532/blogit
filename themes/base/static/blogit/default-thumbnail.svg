<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- 記事カードの既定のサムネイル（書類とペン）。明るい・暗い表示のどちらでも見えるよう、背景色を持たせる -->
  <rect width="300" height="300" fill="#f2f2f2"/>
  <g stroke="#1f1f1f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 書類 -->
    <path d="M62 50 H218 L238 70 V250 H62 Z" fill="#ffffff" transform="rotate(-6 150 150)"/>
    <g transform="rotate(-6 150 150)">
      <!-- 角の折り返し -->
      <path d="M218 50 V70 H238 Z" fill="#e0e0e0"/>
      <!-- 画像の枠 -->
      <rect x="86" y="80" width="62" height="54" rx="6" fill="#e0e0e0"/>
      <path d="M92 128 L110 106 L122 118 L132 108 L144 128" fill="none" stroke-width="5"/>
      <circle cx="131" cy="94" r="5" fill="#1f1f1f" stroke="none"/>
      <!-- 本文 -->
      <path d="M86 160 H214" fill="none"/>
      <path d="M86 182 H196" fill="none"/>
      <!-- 箇条書き -->
      <circle cx="90" cy="208" r="4" fill="#1f1f1f" stroke="none"/>
      <path d="M106 208 H206" fill="none"/>
      <circle cx="90" cy="230" r="4" fill="#1f1f1f" stroke="none"/>
      <path d="M106 230 H180" fill="none"/>
    </g>
    <!-- ペン -->
    <g transform="rotate(-38 214 112)">
      <rect x="176" y="98" width="96" height="28" rx="5" fill="#ffffff"/>
      <path d="M176 98 L146 112 L176 126 Z" fill="#e0e0e0"/>
      <path d="M154 108.3 L146 112 L154 115.7 Z" fill="#1f1f1f" stroke-width="4"/>
      <path d="M252 98 V126" fill="none" stroke-width="5"/>
    </g>
  </g>
</svg>
