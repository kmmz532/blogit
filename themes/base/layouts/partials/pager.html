{{- /* 引数は Pager */ -}}
{{- if gt .TotalPages 1 }}
<nav class="pager" aria-label="{{ T "pagination" }}">
  {{- if .HasPrev }}
  <a href="{{ .First.URL }}" aria-label="{{ T "first_page" }}" title="{{ T "first_page" }}"><i class="fa-solid fa-angles-left" aria-hidden="true"></i></a>
  <a href="{{ .Prev.URL }}" aria-label="{{ T "prev_page" }}" title="{{ T "prev_page" }}"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
  {{- else }}
  <span class="disabled"><i class="fa-solid fa-angles-left" aria-hidden="true"></i></span>
  <span class="disabled"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></span>
  {{- end }}
  {{- range .Pagers }}
  {{- if eq .PageNumber $.PageNumber }}
  <span class="current" aria-current="page">{{ .PageNumber }}</span>
  {{- else }}
  <a href="{{ .URL }}">{{ .PageNumber }}</a>
  {{- end }}
  {{- end }}
  {{- if .HasNext }}
  <a href="{{ .Next.URL }}" aria-label="{{ T "next_page" }}" title="{{ T "next_page" }}"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></a>
  <a href="{{ .Last.URL }}" aria-label="{{ T "last_page" }}" title="{{ T "last_page" }}"><i class="fa-solid fa-angles-right" aria-hidden="true"></i></a>
  {{- else }}
  <span class="disabled"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span>
  <span class="disabled"><i class="fa-solid fa-angles-right" aria-hidden="true"></i></span>
  {{- end }}
</nav>
{{- end }}
