name: web

# Web アプリ（packages/web）を GitHub Pages に公開する
on:
  push:
    branches: [main]
    paths:
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Settings → Secrets and variables → Actions → Variables に登録する（未設定なら PAT ログイン）
          VITE_GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          VITE_AUTH_WORKER_URL: ${{ vars.AUTH_WORKER_URL }}
          VITE_GITLAB_CLIENT_ID: ${{ vars.GITLAB_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/web/dist

  # アーティファクトはジョブが終わってから確定するので、公開は別のジョブで行う
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
