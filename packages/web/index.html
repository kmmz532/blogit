<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <script>
      // ブログの管理画面（hugo-gh-admin）の「GitHub でログイン」の中継。OAuth App のコールバック URL はこのページなので、
      // state が戻り先を含む JSON（{"r": 戻り先, "s": 確認用の値}）のときは、コードをブログのログイン画面へ渡す。
      // Blogit 自身のログインの state はランダムな ID なので、ここでは何もしない
      (function () {
        var params = new URLSearchParams(location.search);
        var raw = params.get('state');
        if (!raw || (!params.get('code') && !params.get('error'))) return;
        var state;
        try {
          var text = atob(raw.replace(/-/g, '+').replace(/_/g, '/'));
          state = JSON.parse(new TextDecoder().decode(Uint8Array.from(text, function (c) { return c.charCodeAt(0); })));
        } catch (e) { return; }
        if (!state || typeof state.r !== 'string') return;
        try {
          var back = new URL(state.r);
          var local = back.hostname === 'localhost' || back.hostname === '127.0.0.1';
          if (back.protocol !== 'https:' && !(back.protocol === 'http:' && local)) return;
          back.search = '';
          back.hash = '';
          ['code', 'error', 'error_description'].forEach(function (key) {
            if (params.get(key)) back.searchParams.set(key, params.get(key));
          });
          back.searchParams.set('state', String(state.s));
          window.blogitRelaying = true;
          location.replace(back.href);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blogit</title>
    <meta name="description" content="GitHubやGitLabのアカウントで、無料のHugoブログを構築するツール">
    <link rel="canonical" href="https://blogit.kmmz.jp/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Blogit">
    <meta property="og:title" content="Blogit">
    <meta property="og:description" content="GitHubやGitLabのアカウントで、無料のHugoブログを構築するツール">
    <meta property="og:url" content="https://blogit.kmmz.jp/">
    <meta property="og:image" content="https://blogit.kmmz.jp/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ja_JP">
    <meta name="twitter:card" content="summary_large_image">
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        var locale = null;
        try { locale = localStorage.getItem('blogit:locale'); } catch (e) {}
        document.documentElement.lang = locale || (navigator.language.toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en');
      })();
    </script>
    <link rel="icon" href="./favicon.ico" sizes="48x48">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
