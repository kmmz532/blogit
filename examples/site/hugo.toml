# テーマ確認用のサンプルブログ。scripts/theme-screenshots.mjs がテーマを差し替えてビルドする
title = "サンプルブログ"
baseURL = "http://localhost/"
languageCode = "ja"
defaultContentLanguage = "ja"
timeZone = "Asia/Tokyo"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  description = "Blogit のテーマ確認用サンプルです。"
  author = "Blogit"
  bio = "GitHub だけで運用できる Hugo ブログ"
  footer = "© 2026 Blogit"
  [[params.links]]
    name = "GitHub"
    url = "https://github.com/kmmz532/blogit"
    icon = "fa-brands fa-github"
  [params.ghAdmin]
    repo = "kmmz532/blogit-sample"

[[module.imports]]
  path = "github.com/kmmz532/blogit/themes/default"
